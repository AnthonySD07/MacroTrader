
name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Fix Capacitor CLI permissions
        run: |
          chmod +x node_modules/@capacitor/cli/bin/capacitor
          chmod +x node_modules/.bin/cap

      - name: Build notification bundle
        run: |
          chmod +x node_modules/.bin/esbuild
          chmod +x node_modules/esbuild/bin/esbuild
          node node_modules/esbuild/bin/esbuild native-notifications.js --bundle --format=iife --outfile=notifications.bundle.js

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest sw.js notifications.bundle.js www/
          cp -r icons www/

      - name: Create Android project
        run: npx --no-install cap add android

      - name: Sync Android project
        run: npx --no-install cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: macro-trader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
