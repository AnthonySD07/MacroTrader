name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files into www
        run: |
          mkdir www
          cp index.html app.js styles.css manifest.webmanifest sw.js www/
          cp -r icons www/

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: macro-trader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
