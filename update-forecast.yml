name: Update forecast data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download calendar
        run: python3 scripts/update_forecast.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/forecast.json
          # ignore the timestamp-only change: commit only when events differ
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          python3 - <<'PY'
          import json, subprocess
          old = subprocess.run(["git","show","HEAD:data/forecast.json"],capture_output=True,text=True).stdout
          try: same = json.loads(old)["events"] == json.load(open("data/forecast.json"))["events"]
          except Exception: same = False
          open("/tmp/same","w").write("1" if same else "0")
          PY
          if [ "$(cat /tmp/same)" = "1" ]; then echo "events unchanged"; exit 0; fi
          git commit -m "Update forecast data"
          git push
